<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cerca offerte</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0 auto;padding:16px;background:#111;color:#eee;max-width:520px}
  h1{font-size:20px;margin:8px 0 12px}
  .card{background:#1d1d1d;border-radius:12px;padding:14px;margin:10px 0}
  label{display:block;font-size:14px;color:#aaa;margin-top:8px}
  input,select{width:100%;padding:10px;font-size:16px;border-radius:8px;border:1px solid #444;background:#222;color:#eee;box-sizing:border-box;margin-top:4px}
  .shop{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #2a2a2a}
  .shop:last-child{border-bottom:0}
  a.btn{display:inline-block;padding:10px 14px;border-radius:8px;background:#2b7fff;color:#fff;text-decoration:none;font-size:15px}
  .warn{color:#f1c40f;font-size:13px;line-height:1.4;margin-top:10px}
</style>
</head>
<body>
<h1>Cerca la migliore offerta</h1>

<div class="card">
  <label>Cosa cerchi?</label>
  <input id="q" type="text" placeholder="Es. cuffie bluetooth Sony WH-1000XM5">
  <label>Categoria (facoltativa)</label>
  <select id="cat">
    <option value="">Tutte</option>
    <option value="elettronica">Elettronica</option>
    <option value="utensili">Utensili e ricambi</option>
    <option value="casa">Casa e cucina</option>
    <option value="sport">Sport e tempo libero</option>
  </select>
</div>

<div class="card" id="shops"></div>

<p class="warn">
Questa pagina crea solo i link di ricerca: i prezzi li verifichi aprendo ciascun sito.
Confronta sempre prezzo totale, spedizione e venditore prima di acquistare.
</p>

<script>
  const SHOPS = [
    { name: 'Amazon.it', url: q => 'https://www.amazon.it/s?k=' + q },
    { name: 'Google Shopping', url: q => 'https://www.google.it/search?tbm=shop&q=' + q },
    { name: 'eBay.it', url: q => 'https://www.ebay.it/sch/i.html?_nkw=' + q },
    { name: 'Subito.it (usato)', url: q => 'https://www.subito.it/annunci-italia/vendita/usato/?q=' + q }
  ];

  function render() {
    const raw = document.getElementById('q').value.trim();
    const cat = document.getElementById('cat').value;
    const term = [raw, cat].filter(Boolean).join(' ');
    const box = document.getElementById('shops');
    if (!term) {
      box.innerHTML = '<div class="lbl">Scrivi un prodotto per vedere i link di ricerca.</div>';
      return;
    }
    const q = encodeURIComponent(term);
    box.innerHTML = SHOPS.map(s =>
      '<div class="shop"><span>' + s.name + '</span>' +
      '<a class="btn" target="_blank" rel="noopener" href="' + s.url(q) + '">Apri</a></div>'
    ).join('');
  }

  document.getElementById('q').addEventListener('input', render);
  document.getElementById('cat').addEventListener('change', render);
  render();
</script>
</body>
</html>
